<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Contact Mehrab Bhuiyan for software engineering, data analytics, and technology education opportunities.">
  <meta property="og:title" content="Contact | Mehrab Bhuiyan">
  <meta property="og:description" content="Get in touch with Mehrab Bhuiyan for software engineering and data analytics opportunities.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/profile.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title>Contact — Mehrab Bhuiyan</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://mebss.com/contact.html">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- SITE HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1>Mehrab Bhuiyan</h1>
        <p class="subtitle">Software Engineer &amp; Data Analyst</p>
      </div>

      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <button class="menu-close" aria-label="Close menu">✕</button>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>

      <div class="social-links">
        <a href="mailto:hi@mebss.com" aria-label="Email">
          <img class="icon" src="images/mail.png" alt="Email icon" />
        </a>
        <a href="https://www.linkedin.com/in/mehrab-bhuiyan-07425a181/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <img class="icon" src="images/linkedin.png" alt="LinkedIn icon" />
        </a>
      </div>

      <button class="menu-toggle"
              aria-label="Toggle menu"
              aria-expanded="false"
              aria-controls="site-nav">
        ☰
      </button>
    </div>
  </header>

  <!-- CONTACT SECTION -->
  <section id="contact">
    <h2>Contact</h2>
    <div class="contact-container">

      <!-- Contact Info -->
      <div class="contact-info section-content">
        <p><strong>Email:</strong> <a href="mailto:hi@mebss.com">hi@mebss.com</a></p>
        <p><strong>Phone:</strong> +64 27 499 5368</p>
        <p><strong>LinkedIn:</strong>
          <a href="https://www.linkedin.com/in/mehrab-bhuiyan-07425a181/" target="_blank" rel="noopener">
            linkedin.com/in/mehrab-bhuiyan
          </a>
        </p>
        <p><strong>GitHub:</strong>
          <a href="https://github.com/mebss" target="_blank" rel="noopener">
            github.com/mebss
          </a>
        </p>
      </div>

      <!-- Contact Form -->
      <div class="contact-form-wrapper section-content">
        <form
          id="contact-form"
          class="contact-form"
          action="https://formspree.io/f/xwpbvyeo"
          method="POST"
        >
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
          <!-- honeypot -->
          <input type="text" name="_gotcha" style="display:none" />
          <button type="submit">Send Message</button>
          <div id="form-status" aria-live="polite"></div>
        </form>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 Mehrab Bhuiyan. Built with HTML, CSS, and JavaScript.</p>
      <nav aria-label="Footer links">
        <a href="mailto:hi@mebss.com">Email</a>
        <a href="https://github.com/mebss" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/mehrab-bhuiyan-07425a181/" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </div>
  </footer>

  <!-- SINGLE SCRIPT ENTRY -->
  <script src="js/main.js"></script>
</body>
</html>
